<title id="title">A five-point capture can cost nine</title><desc id="description">Cropped teaching position. Red Queen h4 can capture Blue Rook j4 for five points. After quiet Blue and Yellow King moves, Green Bishop m7 can capture that Queen on j4 for nine points. Both captures are engine-validated legal moves.</desc>
