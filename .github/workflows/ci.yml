name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch supersedes whatever is still running for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here: pnpm/action-setup reads packageManager from
      # package.json, and pinning both is the conflict that broke the Pages
      # workflow in #2.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Separate steps rather than one `turbo run lint test build`, so a red
      # check names which of the three failed without opening the log.
      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - name: Validate maintained D1 migrations and canonical persistence
        run: pnpm --filter @li4chess/persistence test:integration
        env:
          M3_03_OUTPUT: ${{ github.workspace }}/arena-results/m3-03-ci
          WRANGLER_SEND_METRICS: "false"

      - name: Retain D1 persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-03-d1-persistence-evidence
          path: |
            arena-results/m3-03-ci/*.json
            arena-results/m3-03-ci/*.json.gz
            arena-results/m3-03-ci/*.log
          retention-days: 14

      - name: Validate local Cloudflare architecture and crash recovery
        run: pnpm --filter @li4chess/architecture-spike test:integration
        env:
          M3_OUTPUT: ${{ github.workspace }}/arena-results/m3-01-ci
          WRANGLER_SEND_METRICS: "false"

      - name: Validate authoritative GameRoom timing, alarms and recovery
        run: pnpm --filter @li4chess/game-room test:integration
        env:
          M3_04_OUTPUT: ${{ github.workspace }}/arena-results/m3-04-ci
          WRANGLER_SEND_METRICS: "false"

      - name: Retain GameRoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-04-game-room-evidence
          path: |
            arena-results/m3-04-ci/*.json
            arena-results/m3-04-ci/*.json.gz
            arena-results/m3-04-ci/*.log
          retention-days: 14

      - name: Retain architecture integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-01-local-runtime-evidence
          path: |
            arena-results/m3-01-ci/manifest.json
            arena-results/m3-01-ci/configuration.json
            arena-results/m3-01-ci/summary.json
            arena-results/m3-01-ci/observations.json
            arena-results/m3-01-ci/runtime.log
            arena-results/m3-01-ci/*.replay.json
          retention-days: 14

      - name: Install Chromium for browser tests
        run: pnpm --filter @li4chess/web exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm --filter @li4chess/web test:e2e

      - name: Retain failed local-play browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-play-browser-failure
          path: apps/web/test-results/
          retention-days: 14

      - name: Build isolated Workers application and validate deployment configuration locally
        run: |
          pnpm build:workers
          pnpm check:workers
          pnpm --filter @li4chess/worker check:room
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Validate application HTTP and browser behavior through local workerd
        run: pnpm test:workers
        env:
          M3_02_OUTPUT: ${{ github.workspace }}/arena-results/m3-02-ci
          WRANGLER_SEND_METRICS: "false"

      - name: Retain Workers foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-02-workers-foundation-evidence
          include-hidden-files: true
          path: |
            arena-results/m3-02-ci/*.json
            arena-results/m3-02-ci/*.json.gz
            arena-results/m3-02-ci/*.log
            arena-results/m3-02-ci/*.png
            arena-results/m3-02-ci/browser/
            apps/worker/.generated/dry-run-staging/
            apps/worker/.generated/dry-run-production/
          retention-days: 14

      - name: Build and validate opt-in authenticated multiplayer locally
        run: |
          pnpm --filter @li4chess/worker build:multiplayer
          pnpm --filter @li4chess/worker check:multiplayer
          pnpm --filter @li4chess/worker test:multiplayer
        env:
          M3_05_OUTPUT: ${{ github.workspace }}/arena-results/m3-05-ci
          WRANGLER_SEND_METRICS: "false"

      - name: Retain authenticated multiplayer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-05-multiplayer-evidence
          path: |
            arena-results/m3-05-ci/*.json
            arena-results/m3-05-ci/*.log
            arena-results/m3-05-ci/*.png
          retention-days: 14
